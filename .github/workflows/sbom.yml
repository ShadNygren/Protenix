name: SBOM Generation

on:
  push:
    branches: [ vhc-main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  sbom-python:
    name: Generate Python SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cyclonedx-bom

      - name: Generate SBOM for Python dependencies
        run: |
          pip install -r requirements.txt
          # cyclonedx-py command format: cyclonedx-py <command> [options]
          # For requirements.txt files, use 'requirements' command
          cyclonedx-py requirements -i requirements.txt -o sbom-python.json
          cyclonedx-py requirements -i requirements.txt -o sbom-python.xml --output-format xml

      - name: Upload Python SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-python
          path: |
            sbom-python.json
            sbom-python.xml

  sbom-docker:
    name: Generate Docker SBOM
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [runtime, devel]  # Only generate SBOM for existing images
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Docker image exists
        id: image_check
        run: |
          if docker pull ghcr.io/shadnygren/protenix:${{ matrix.image }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image ghcr.io/shadnygren/protenix:${{ matrix.image }} not found, skipping SBOM generation"
          fi
        continue-on-error: true

      - name: Generate SBOM using Syft
        if: steps.image_check.outputs.exists == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/shadnygren/protenix:${{ matrix.image }}
          artifact-name: sbom-docker-${{ matrix.image }}
          format: spdx-json
        continue-on-error: true

      - name: Generate SBOM with Docker Scout
        if: steps.image_check.outputs.exists == 'true'
        run: |
          docker sbom ghcr.io/shadnygren/protenix:${{ matrix.image }} > sbom-scout-${{ matrix.image }}.json || true
        continue-on-error: true

  sbom-summary:
    name: SBOM Summary and Attestation
    runs-on: ubuntu-latest
    needs: [sbom-python, sbom-docker]
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Download all SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: sboms/

      - name: Create SBOM summary
        run: |
          echo "# Software Bill of Materials (SBOM)" > sbom-summary.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> sbom-summary.md
          echo "" >> sbom-summary.md
          echo "## Available SBOMs:" >> sbom-summary.md
          echo "- Python Dependencies SBOM" >> sbom-summary.md
          echo "- Docker Runtime Image SBOM" >> sbom-summary.md
          echo "- Docker Runtime+Weights Image SBOM" >> sbom-summary.md
          echo "- Docker Devel Image SBOM" >> sbom-summary.md
          echo "- Docker Devel+Weights Image SBOM" >> sbom-summary.md

      - name: Upload SBOM Summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-summary
          path: |
            sbom-summary.md
            sboms/

      - name: Attest SBOM
        uses: actions/attest-sbom@21f269c03431211cf2de4a1b5d90001746539dc9 # v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: 'sboms/'
          sbom-path: 'sboms/'
          push-to-registry: true
