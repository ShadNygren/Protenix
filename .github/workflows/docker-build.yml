name: Build and Push Docker Image

on:
  push:
    branches:
      - VHC-March2026
      - release
    tags:
      - 'v*'
  pull_request:
    branches:
      - VHC-March2026
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2  # Limit parallel builds to avoid disk space issues
      matrix:
        include:
          - variant: runtime
            weights: false
            suffix: ""
          - variant: runtime
            weights: true
            suffix: "-with-weights"
          - variant: devel
            weights: false
            suffix: "-devel"
          - variant: devel
            weights: true
            suffix: "-devel-with-weights"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.variant }}${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/VHC-March2026' }}
            type=raw,value=release-${{ matrix.variant }}${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/VHC-March2026' && matrix.variant == 'runtime' && matrix.weights == false }}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.weights }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.weights }}
          build-args: |
            BASE_IMAGE_VARIANT=${{ matrix.variant }}
            INCLUDE_WEIGHTS=${{ matrix.weights }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
