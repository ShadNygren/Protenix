name: Build and Push Docker Image

on:
  push:
    branches:
      - vhc-main
    tags:
      - 'v*'
  pull_request:
    branches:
      - vhc-main
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2  # Limit parallel builds to avoid disk space issues
      matrix:
        include:
          # Lightweight image: no baked-in weights, pulls checkpoint from R2 at
          # startup via stage_training_data.py. Faster cold-start, smaller image.
          # Use for training (always resumes from an R2 checkpoint anyway).
          - variant: devel
            weights: false
            suffix: "-devel"
          # Full image: baked-in base model weights for inference/prediction
          # without needing R2 access. Larger image (~4 GB heavier).
          - variant: devel
            weights: true
            suffix: "-devel-with-weights"
          # Uncomment when needed:
          # - variant: runtime
          #   weights: false
          #   suffix: ""
          # - variant: runtime
          #   weights: true
          #   suffix: "-with-weights"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.variant }}${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/vhc-main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/vhc-main' && matrix.variant == 'runtime' && matrix.weights == false }}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.weights }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.weights }}
          build-args: |
            BASE_IMAGE_VARIANT=${{ matrix.variant }}
            INCLUDE_WEIGHTS=${{ matrix.weights }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
