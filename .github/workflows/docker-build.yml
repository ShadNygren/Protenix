name: Build and Push Docker Image

on:
  push:
    branches:
      - docker-pytorch  # Consolidated branch for Docker builds
      - testing
      - release
    tags:
      - 'v*'
  pull_request:
    branches:
      - docker-pytorch
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2  # Limit parallel builds to avoid disk space issues
      matrix:
        include:
          - variant: runtime
            weights: false
            suffix: ""
            tag_suffix: ""
          - variant: runtime
            weights: true
            suffix: "-with-weights"
            tag_suffix: "_weights"  # Using underscore since + is not allowed
          - variant: devel
            weights: false
            suffix: ""
            tag_suffix: ""
          - variant: devel
            weights: true
            suffix: "-with-weights"
            tag_suffix: "_weights"
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: ${{ matrix.weights }}  # Only checkout LFS files for weights variants
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.variant }}${{ matrix.tag_suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.variant }}${{ matrix.tag_suffix }},enable=${{ github.ref == 'refs/heads/docker-pytorch' }}
            type=raw,value=${{ matrix.variant }}_plus_weights,enable=${{ github.ref == 'refs/heads/docker-pytorch' && matrix.weights == true }}
            type=raw,value=testing-${{ matrix.variant }}${{ matrix.tag_suffix }},enable=${{ github.ref == 'refs/heads/testing' }}
            type=raw,value=release-${{ matrix.variant }}${{ matrix.tag_suffix }},enable=${{ github.ref == 'refs/heads/release' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/docker-pytorch' && matrix.variant == 'runtime' && matrix.weights == false }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}${{ matrix.suffix }}
          build-args: |
            BASE_IMAGE_VARIANT=${{ matrix.variant }}
            INCLUDE_WEIGHTS=${{ matrix.weights }}
            WEIGHTS_VERSION=v0.5.0
            WEIGHTS_URL=https://af3-dev.tos-cn-beijing.volces.com/release_model/model_v0.5.0.pt
            WEIGHTS_MODEL_NAME=protenix_base_default_v0.5.0
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}