name: Build and Push Docker Image

on:
  push:
    branches:
      - vhc-main
    tags:
      - 'v*'
  pull_request:
    branches:
      - vhc-main
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2  # Limit parallel builds to avoid disk space issues
      matrix:
        include:
          # Only building devel-with-weights for now (the one we use on RunPod)
          # Uncomment others when needed:
          # - variant: runtime
          #   weights: false
          #   suffix: ""
          # - variant: runtime
          #   weights: true
          #   suffix: "-with-weights"
          # - variant: devel
          #   weights: false
          #   suffix: "-devel"
          - variant: devel
            weights: true
            suffix: "-devel-with-weights"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.variant }}${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/vhc-main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/vhc-main' && matrix.variant == 'runtime' && matrix.weights == false }}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.weights }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.weights }}
          build-args: |
            BASE_IMAGE_VARIANT=${{ matrix.variant }}
            INCLUDE_WEIGHTS=${{ matrix.weights }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
