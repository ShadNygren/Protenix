name: Build and Push Docker Image

on:
  push:
    branches:
      - VHC-Main
    tags:
      - 'v*'
  pull_request:
    branches:
      - VHC-Main
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2  # Limit parallel builds to avoid disk space issues
      matrix:
        include:
          # Only building devel-with-weights for now (the one we use on RunPod)
          # Uncomment others when needed:
          # - variant: runtime
          #   weights: false
          #   suffix: ""
          # - variant: runtime
          #   weights: true
          #   suffix: "-with-weights"
          # - variant: devel
          #   weights: false
          #   suffix: "-devel"
          - variant: devel
            weights: true
            suffix: "-devel-with-weights"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ matrix.variant }}${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/VHC-Main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/VHC-Main' && matrix.variant == 'runtime' && matrix.weights == false }}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.weights }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.weights }}
          build-args: |
            BASE_IMAGE_VARIANT=${{ matrix.variant }}
            INCLUDE_WEIGHTS=${{ matrix.weights }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
