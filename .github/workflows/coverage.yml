name: Code Coverage

on:
  push:
    branches: [ VHC-Main ]
  pull_request:
    branches: [ VHC-Main ]

permissions: read-all

jobs:
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          # Run unittest tests with coverage (upstream ByteDance approach)
          echo "Running unittest tests (ByteDance upstream approach)..."
          # Known issue: PyTorch JIT compilation creates temporary files that coverage.py cannot find
          # This causes "No source for code: '/tmp/tmpXXXXXXXX/_remote_module_non_scriptable.py'" errors
          # The tests still run and coverage for actual source files is collected correctly
          coverage run -m unittest discover tests/ || true
          coverage xml -o coverage-unittest.xml || true
          coverage report --format=markdown > coverage-unittest.md || true

          # Run pytest tests with coverage (for additional features and our tests)
          echo "Running pytest tests (additional coverage)..."
          pytest --cov=protenix --cov-branch --cov-report=xml:coverage-pytest.xml --cov-report=term tests/ || true

          # Combine coverage reports from both test runners
          echo "Combining coverage reports..."
          coverage combine || true

          # Known issue: PyTorch JIT compilation creates temporary files that coverage.py cannot find
          # Error: "No source for code: '/tmp/tmpXXXXXXXX/_remote_module_non_scriptable.py'"
          # This is a known issue between coverage.py and PyTorch's JIT compiler
          # Adding "|| true" allows the workflow to continue despite this error
          # The coverage data for actual source files is still collected correctly
          # TODO: Remove "|| true" once this issue is fixed upstream
          coverage xml -o coverage-combined.xml || true
          coverage html -d htmlcov || true
          coverage report || true

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-combined.xml,./coverage-unittest.xml,./coverage-pytest.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail the build if CodeCov is down
          verbose: true
        continue-on-error: true  # Workflow continues even if this step fails

      - name: Generate coverage badge
        run: |
          coverage report --format=markdown > coverage-report.md
          echo "Coverage Report:" >> $GITHUB_STEP_SUMMARY
          cat coverage-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-reports
          path: |
            coverage*.xml
            coverage*.md
            htmlcov/
        if: always()  # Upload artifacts even if previous steps fail
