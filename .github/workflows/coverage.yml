name: Code Coverage

on:
  push:
    branches: [ docker-pytorch, testing ]
  pull_request:
    branches: [ docker-pytorch ]

jobs:
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          # Run unittest tests with coverage (upstream ByteDance approach)
          echo "Running unittest tests (ByteDance upstream approach)..."
          coverage run -m unittest discover tests/
          coverage xml -o coverage-unittest.xml
          coverage report --format=markdown > coverage-unittest.md
          
          # Run pytest tests with coverage (for additional features and our tests)
          echo "Running pytest tests (additional coverage)..."
          pytest --cov=protenix --cov-branch --cov-report=xml:coverage-pytest.xml --cov-report=term tests/ || true
          
          # Combine coverage reports from both test runners
          echo "Combining coverage reports..."
          coverage combine || true
          coverage xml -o coverage-combined.xml
          coverage html -d htmlcov
          coverage report

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-combined.xml,./coverage-unittest.xml,./coverage-pytest.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail the build if CodeCov is down
          verbose: true
        continue-on-error: true  # Workflow continues even if this step fails

      - name: Generate coverage badge
        run: |
          coverage report --format=markdown > coverage-report.md
          echo "Coverage Report:" >> $GITHUB_STEP_SUMMARY
          cat coverage-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage*.xml
            coverage*.md
            htmlcov/
        if: always()  # Upload artifacts even if previous steps fail