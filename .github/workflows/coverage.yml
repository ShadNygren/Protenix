name: Code Coverage

on:
  push:
    branches: [ docker-pytorch, testing ]
  pull_request:
    branches: [ docker-pytorch ]

jobs:
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          # Run unittest tests with coverage
          coverage run -m unittest discover tests/
          coverage xml -o coverage-unittest.xml
          
          # Run pytest tests with coverage if available
          pytest --cov=protenix --cov-report=xml:coverage-pytest.xml tests/ || true
          
          # Combine coverage reports
          coverage combine || true
          coverage xml -o coverage.xml
          coverage report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}  # Optional for public repos
          files: ./coverage.xml,./coverage-unittest.xml,./coverage-pytest.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false  # Don't fail the build if upload fails
          verbose: true

      - name: Generate coverage badge
        run: |
          coverage report --format=markdown > coverage-report.md
          echo "Coverage Report:" >> $GITHUB_STEP_SUMMARY
          cat coverage-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage*.xml
            coverage-report.md
            htmlcov/