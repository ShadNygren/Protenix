codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 70%
        threshold: 2%
        base: auto
        flags:
          - unittests
        paths:
          - "protenix"
    patch:
      default:
        target: 60%
        threshold: 5%
        base: auto

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  unittests:
    paths:
      - protenix/
    carryforward: true

ignore:
  - "tests/"
  - "setup.py"
  - "**/__pycache__"
  - "**/*.egg-info"
  - "docs/"
  - "examples/"